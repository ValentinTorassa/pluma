name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · build (${{ matrix.tenant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant:
          - yanina
          # - vt  # fase 3: agregar cuando exista la segunda instancia
    env:
      PLUMA_TENANT: ${{ matrix.tenant }}
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores ficticios: el build no debe necesitar secretos reales.
      # /opengraph-image se prerenderiza en build y lee la tabla `settings`,
      # así que usamos una SQLite local creada desde drizzle/ (nunca Turso).
      TURSO_DATABASE_URL: file:ci.db
      AUTH_SECRET: ci-dummy-secret-not-used-in-production
      IP_SALT: ci-dummy-salt
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD: ci
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # PageProps/LayoutProps son tipos globales generados por Next.
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Local SQLite from migrations
        run: node scripts/create-local-db.mjs

      - name: Build
        run: npm run build
