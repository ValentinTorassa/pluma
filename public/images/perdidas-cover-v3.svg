<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Un nido vacío y una pluma que parte">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="55%" stop-color="#f5ede6"/>
      <stop offset="100%" stop-color="#e8d9c8"/>
    </linearGradient>
    <pattern id="agrain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1917" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#abg)"/>
  <rect width="1200" height="600" fill="url(#agrain)"/>

  <!-- Nido: cuenco de ramas entrelazadas -->
  <g fill="none" stroke="#9a3412" stroke-linecap="round" opacity="0.85">
    <path d="M 400 330 Q 600 430 800 330" stroke-width="5"/>
    <path d="M 420 315 Q 600 400 780 315" stroke-width="3.5" opacity="0.7"/>
    <path d="M 445 348 Q 600 415 755 348" stroke-width="3" opacity="0.55"/>
    <path d="M 470 300 Q 600 360 730 300" stroke-width="2.5" opacity="0.45"/>
    <!-- Ramitas sueltas -->
    <path d="M 430 340 Q 480 355 520 345" stroke-width="2.5" opacity="0.5"/>
    <path d="M 660 350 Q 710 360 750 340" stroke-width="2.5" opacity="0.5"/>
  </g>
  <!-- Hueco del nido -->
  <ellipse cx="600" cy="322" rx="170" ry="26" fill="#9a3412" opacity="0.07"/>

  <!-- Trayectoria punteada -->
  <path d="M 620 300 C 700 220, 800 190, 900 150 S 1000 120, 1030 130"
        fill="none" stroke="#78716c" stroke-width="2.5" stroke-dasharray="1 14" stroke-linecap="round" opacity="0.6"/>

  <!-- Pluma que parte -->
  <g transform="translate(1035 70) rotate(28) scale(6)" fill="none" stroke="#9a3412" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
    <line x1="16" y1="8" x2="2" y2="22"/>
    <line x1="17.5" y1="15" x2="9" y2="15"/>
  </g>

  <rect x="80" y="510" width="220" height="4" rx="2" fill="#9a3412" opacity="0.85"/>
</svg>
