<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Un ciclo roto y una pluma que escapa por la apertura">
  <defs>
    <linearGradient id="vcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="55%" stop-color="#f5ede6"/>
      <stop offset="100%" stop-color="#e8d9c8"/>
    </linearGradient>
    <pattern id="vcgrain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1917" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#vcbg)"/>
  <rect width="1200" height="600" fill="url(#vcgrain)"/>

  <!-- Ciclo de violencia: tres arcos con flechas -->
  <g fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <path d="M 641 370 A 140 140 0 0 1 430 407" />
    <path d="M 399 370 A 140 140 0 0 1 472 168" />
    <path d="M 520 160 A 140 140 0 0 1 652 252" />
  </g>
  <!-- Flechas del ciclo -->
  <g fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M 448 392 L 428 409 L 452 416" />
    <path d="M 460 186 L 474 166 L 486 190" />
    <path d="M 636 236 L 656 254 L 630 262" />
  </g>
  <!-- Interior del ciclo -->
  <circle cx="520" cy="300" r="95" fill="#9a3412" opacity="0.06"/>

  <!-- Trayectoria de escape por la apertura -->
  <path d="M 660 240 C 730 190, 800 160, 880 130 S 980 105, 1010 115"
        fill="none" stroke="#78716c" stroke-width="2.5" stroke-dasharray="1 14" stroke-linecap="round" opacity="0.6"/>

  <!-- Pluma que rompe el ciclo -->
  <g transform="translate(1015 55) rotate(26) scale(5.8)" fill="none" stroke="#9a3412" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
    <line x1="16" y1="8" x2="2" y2="22"/>
    <line x1="17.5" y1="15" x2="9" y2="15"/>
  </g>

  <rect x="80" y="510" width="220" height="4" rx="2" fill="#9a3412" opacity="0.85"/>
</svg>
