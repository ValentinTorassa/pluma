<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Composición abstracta: pluma y balanza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ede6"/>
      <stop offset="55%" stop-color="#eadfd2"/>
      <stop offset="100%" stop-color="#d9c6b2"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#5c2009"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c1917" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grain)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- Círculos decorativos -->
  <circle cx="1030" cy="110" r="180" fill="#9a3412" opacity="0.08"/>
  <circle cx="1030" cy="110" r="120" fill="#9a3412" opacity="0.08"/>
  <circle cx="120" cy="520" r="140" fill="#1c1917" opacity="0.05"/>

  <!-- Balanza estilizada -->
  <g stroke="#1c1917" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="900" y1="170" x2="900" y2="430"/>
    <line x1="780" y1="230" x2="1020" y2="230"/>
    <line x1="860" y1="450" x2="940" y2="450"/>
  </g>
  <g fill="none" stroke="#1c1917" stroke-width="4" opacity="0.85">
    <path d="M 780 230 L 740 330 M 780 230 L 820 330"/>
    <path d="M 715 330 A 65 40 0 0 0 845 330 Z" fill="#faf8f4"/>
    <path d="M 1020 230 L 980 330 M 1020 230 L 1060 330"/>
    <path d="M 955 330 A 65 40 0 0 0 1085 330 Z" fill="#faf8f4"/>
  </g>

  <!-- Pluma -->
  <g transform="translate(160 120) rotate(-14)">
    <path d="M 60 20 C 240 -40 420 60 400 200 C 380 340 180 420 60 420 C 150 320 230 240 400 200 C 230 180 120 120 60 20 Z"
          fill="url(#feather)" opacity="0.92"/>
    <line x1="60" y1="20" x2="240" y2="470" stroke="#5c2009" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Regla editorial -->
  <rect x="80" y="500" width="220" height="4" rx="2" fill="#9a3412"/>
</svg>
